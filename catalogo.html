<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | JC Importaciones</title>
  <meta name="description" content="Catálogo de produtos importados e exportados entre Brasil e Chile. JC Importaciones — confiança, qualidade e logística eficiente.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Botões de quantidade redondos */
    .qtd-plus,
    .qtd-minus {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .qtd-plus:hover,
    .qtd-minus:hover { transform: scale(1.1); }

    .qtd { display: inline-block; min-width: 25px; text-align: center; }

    /* Badge do card */
    .card-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: #FFC107;
      color: #000;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      pointer-events: none;
    }
    .catalogo-card { position: relative; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-azul shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="img/JC importaciones.jpeg" alt="JC Imports" height="45" class="me-2 logo-redondo">
        <strong>JC Importaciones</strong>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
          <li class="nav-item">
            <button class="btn btn-outline-light ms-3 position-relative" id="abrirCarrinho" data-bs-toggle="modal" data-bs-target="#modalCarrinho">
              🛒
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark" id="cartCount">0</span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CATÁLOGO -->
  <section class="py-5 bg-fundo text-center">
    <div class="container">
      <h1 class="text-roxo mb-4 fw-bold">Nosso Catálogo</h1>
      <p class="lead text-muted">Escolha entre produtos <strong>Chilenos 🇨🇱</strong> ou <strong>Brasileiros 🇧🇷</strong></p>
      <div class="d-flex justify-content-center gap-3 mb-4">
        <button id="btnChile" class="btn btn-amarelo px-3">Catálogo Chileno 🇨🇱</button>
        <button id="btnBrasil" class="btn btn-amarelo px-3">Catálogo Brasileiro 🇧🇷</button>
      </div>
      <div id="catalogo" class="row mt-4 g-4"></div>
      <div class="mt-5">
        <button id="verMais" class="btn btn-amarelo px-4 py-2" style="display:none;">Ver Mais Produtos</button>
      </div>
    </div>
  </section>

  <!-- MODAL CARRINHO -->
  <div class="modal fade" id="modalCarrinho" tabindex="-1" aria-labelledby="modalCarrinhoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-azul text-light">
          <h5 class="text-roxo mb-4 fw-bold" id="modalCarrinhoLabel">🛒 Seu Carrinho</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="cartItems"></div>
          <p class="text-muted mt-3" id="emptyCartMsg">Seu carrinho está vazio.</p>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <div><strong>Total de Itens:</strong> <span id="cartTotalItens">0</span></div>
          <div>
            <button id="limparCarrinho" class="btn btn-secondary">Limpar</button>
            <button id="sendWhatsapp" class="btn btn-amarelo">Enviar pelo WhatsApp</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="text-center py-4 bg-azul text-light">
    <img src="img/JC importaciones.jpeg" alt="JC Imports" height="40" class="mb-2 logo-redondo"><br>
    <p class="mb-2">&copy; <span id="currentYear"></span> JC Importaciones. Todos os direitos reservados.</p>
    <div class="d-flex justify-content-center gap-4 mt-3">
      <a href="https://www.instagram.com/jc.importacionesbr" target="_blank" aria-label="Instagram" style="text-decoration:none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
          <path fill="#E1306C" d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2z"/>
        </svg>
      </a>
      <a href="https://wa.me/56992087336" target="_blank" aria-label="WhatsApp" style="text-decoration:none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
          <path fill="#25D366" d="M12.01 2c-5.5 0-10 4.48-10 9.99c0 1.76.46 3.46 1.34 4.98L2 22l5.22-1.37c1.43.78 3.05 1.19 4.78 1.19c5.5 0 10-4.48 10-9.99s-4.5-10-10-10z"/>
        </svg>
      </a>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();

    const container = document.getElementById('catalogo');
    const botao = document.getElementById('verMais');
    const btnChile = document.getElementById('btnChile');
    const btnBrasil = document.getElementById('btnBrasil');

    const cartCount = document.getElementById('cartCount');
    const cartItemsEl = document.getElementById('cartItems');
    const cartTotalItens = document.getElementById('cartTotalItens');
    const limparCarrinhoBtn = document.getElementById('limparCarrinho');
    const sendWhatsappBtn = document.getElementById('sendWhatsapp');
    const emptyCartMsg = document.getElementById('emptyCartMsg');

    let produtos = [];
    let exibidos = 0;
    const porPagina = 6;
    let catalogoAtual = "js/produtos-chile.json";

    let carrinho = JSON.parse(localStorage.getItem('jc_carrinho') || '[]');

    function atualizarContador() {
      const total = carrinho.reduce((s, i) => s + i.quantidade, 0);
      cartCount.textContent = total;
    }

    function salvarCarrinho() {
      localStorage.setItem('jc_carrinho', JSON.stringify(carrinho));
      atualizarContador();
    }

    function atualizarQuantidadeCard(id, quantidade) {
      const qtdEl = document.getElementById(`qtd-${id}`);
      if(qtdEl) qtdEl.textContent = quantidade;
    }

    function atualizarBadge(id, quantidade){
      const badge = document.getElementById(`badge-${id}`);
      if(badge) badge.style.display = quantidade > 0 ? 'flex' : 'none';
    }

    function adicionarAoCarrinho(prod) {
      const existe = carrinho.find(i => String(i.id) === String(prod.id));
      if (existe) existe.quantidade++;
      else carrinho.push({ id: prod.id, nome: prod.nome, imagem: prod.imagem, quantidade: 1 });
      salvarCarrinho();
      renderCarrinho();
      const qtd = carrinho.find(i => i.id === prod.id).quantidade;
      atualizarQuantidadeCard(prod.id, qtd);
      atualizarBadge(prod.id, qtd);
    }

    function removerDoCarrinho(prod) {
      const index = carrinho.findIndex(i => String(i.id) === String(prod.id));
      if(index > -1){
        if(carrinho[index].quantidade > 1) carrinho[index].quantidade--;
        else carrinho.splice(index, 1);
        salvarCarrinho();
        renderCarrinho();
        const qtd = carrinho.find(i => i.id === prod.id)?.quantidade || 0;
        atualizarQuantidadeCard(prod.id, qtd);
        atualizarBadge(prod.id, qtd);
      }
    }

    function renderCarrinho() {
      cartItemsEl.innerHTML = '';
      if (carrinho.length === 0) {
        emptyCartMsg.style.display = 'block';
        cartTotalItens.textContent = 0;
        return;
      }
      emptyCartMsg.style.display = 'none';
      carrinho.forEach(item => {
        const div = document.createElement('div');
        div.className = 'd-flex align-items-center justify-content-between border-bottom py-2';
        div.innerHTML = `
          <div class="d-flex align-items-center">
            <img src="${item.imagem}" alt="${item.nome}" width="50" class="me-2 rounded">
            <div>
              <h6 class="mb-0">${item.nome}</h6>
              <small class="text-muted">Qtd: ${item.quantidade}</small>
            </div>
          </div>
          <div>
            <button class="btn btn-sm btn-outline-danger remove-item" data-id="${item.id}">🗑️</button>
          </div>`;
        cartItemsEl.appendChild(div);
      });
      cartTotalItens.textContent = carrinho.reduce((s, i) => s + i.quantidade, 0);
      atualizarContador();
    }

    function mostrarMais() {
      const total = exibidos + porPagina;
      const lista = produtos.slice(exibidos, total);
      lista.forEach(p => {
        const col = document.createElement('div');
        col.className = "col-6 col-md-4 col-lg-3 col-xl-2";
        col.innerHTML = `
          <div class="card catalogo-card h-100 border-0 shadow-sm">
            <img src="${p.imagem}" alt="${p.nome}" class="img-fluid produto-img">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title text-azul fw-semibold">${p.nome}</h5>
              <p class="card-text text-muted small mb-3">${p.descricao}</p>
              <div class="mt-auto d-flex justify-content-center align-items-center gap-2">
                <button class="qtd-minus btn-roxo" data-id="${p.id}">−</button>
                <span class="qtd text-roxo fw-bold" id="qtd-${p.id}">0</span>
                <button class="qtd-plus btn-roxo" data-id="${p.id}">+</button>
              </div>
            </div>
          </div>`;
        container.appendChild(col);

        // badge
        const badge = document.createElement('div');
        badge.className = 'card-badge';
        badge.id = `badge-${p.id}`;
        badge.style.display = 'none';
        badge.textContent = '🛒';
        col.querySelector('.card').appendChild(badge);

        // Atualiza quantidade do card caso já esteja no carrinho
        const itemCarrinho = carrinho.find(i => i.id === p.id);
        if(itemCarrinho){
          atualizarQuantidadeCard(p.id, itemCarrinho.quantidade);
          atualizarBadge(p.id, itemCarrinho.quantidade);
        }
      });
      exibidos = total;
      botao.style.display = exibidos >= produtos.length ? 'none' : 'inline-block';
    }

    botao.addEventListener('click', mostrarMais);

    async function carregarProdutos() {
      try {
        botao.style.display = 'none';
        container.innerHTML = '<div class="col-12 text-center py-5">Carregando produtos...</div>';
        const resposta = await fetch(catalogoAtual);
        produtos = await resposta.json();
        exibidos = 0;
        container.innerHTML = '';
        mostrarMais();
      } catch (e) {
        console.error("Erro ao carregar produtos:", e);
        container.innerHTML = '<div class="col-12 text-center text-danger py-4">Erro ao carregar produtos.</div>';
      }
    }

    btnChile.addEventListener('click', () => {
      catalogoAtual = "js/produtos-chile.json";
      btnChile.classList.add("active");
      btnBrasil.classList.remove("active");
      carregarProdutos();
    });

    btnBrasil.addEventListener('click', () => {
      catalogoAtual = "js/produtos-brasil.json";
      btnBrasil.classList.add("active");
      btnChile.classList.remove("active");
      carregarProdutos();
    });

    document.addEventListener('click', function(e){
      const id = e.target.dataset.id;
      const prod = produtos.find(x => String(x.id) === String(id));
      if (!prod) return;

      if(e.target.classList.contains('qtd-plus')) adicionarAoCarrinho(prod);
      if(e.target.classList.contains('qtd-minus')) removerDoCarrinho(prod);
      if(e.target.classList.contains('remove-item')){
        carrinho = carrinho.filter(i => String(i.id) !== String(id));
        salvarCarrinho();
        renderCarrinho();
        atualizarQuantidadeCard(id, 0);
        atualizarBadge(id, 0);
      }
    });

    limparCarrinhoBtn.addEventListener('click', () => {
      if (!confirm('Deseja limpar todo o carrinho?')) return;
      carrinho = [];
      salvarCarrinho();
      renderCarrinho();
      produtos.forEach(p => {
        atualizarQuantidadeCard(p.id, 0);
        atualizarBadge(p.id, 0);
      });
    });

    sendWhatsappBtn.addEventListener('click', () => {
      if (carrinho.length === 0) { alert('Seu carrinho está vazio.'); return; }
      const lines = carrinho.map(i => `- ${i.quantidade}x ${i.nome}`);
      const mensagem = `Olá! Gostaria de fazer um pedido:%0A${encodeURIComponent(lines.join('%0A'))}%0A%0AEnviado via JC Importaciones`;
      const numero = '56992087336';
      window.open(`https://wa.me/${numero}?text=${mensagem}`, '_blank');
    });

    salvarCarrinho();
    carregarProdutos();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
